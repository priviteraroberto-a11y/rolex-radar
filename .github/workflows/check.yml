name: Rolex Radar

on:
  schedule:
    # Tre giri al giorno, ognuno su TUTTI gli orologi.
    #
    # Prima erano quattro, ma ciascuno guardava meta' degli orologi a turno:
    # quindi ogni orologio veniva visto due volte al giorno. Ora che un giro
    # li copre tutti, tre giri sono piu' copertura di prima, non meno — con un
    # terzo delle esecuzioni.
    #
    # Il ritardo massimo passa da 12 a 8 ore, ed e' meno grave di quanto
    # sembri: il canale principale sono gli alert email, che restano in
    # casella e vengono letti con una finestra di 7 giorni. Aspettare non
    # significa perdere, significa accorgersene piu' tardi.
    #
    # I minuti non sono zero di proposito.
    #
    # Guardando lo storico vero delle esecuzioni, la programmazione
    # `0 6,10,14,18` produceva questo: le 06:00 non partivano **mai**, le 10:00
    # partivano alle 10:22, le 14:00 alle 17:25, le 18:00 alle 20:18. E fra
    # l'11 e il 12 settembre non e' partito niente per trentasei ore.
    #
    # Non e' un guasto: su GitHub la programmazione e' "quando si puo'", e allo
    # scoccare dell'ora la coda dei runner gratuiti e' piu' affollata. Spostarsi
    # di qualche minuto aiuta; garanzie non ce ne sono.
    #
    # Non si perde niente, si arriva piu' tardi: gli alert restano in casella e
    # il lettore email guarda indietro di 7 giorni.
    #
    # Orari UTC. In estate (CEST) = 08:23 / 14:23 / 20:23 italiane.
    - cron: "23 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Giro di prova senza notifiche"
        type: boolean
        default: false
      force:
        description: "Ignora le ore di silenzio"
        type: boolean
        default: false
      # --- MENU GENERATO da tools/aggiorna_menu.py — non modificare a mano.
      # L'elenco qui sotto e' una copia di cio' che sta in config.yaml, e le
      # copie divergono: era gia' successo coi gruppi di rotazione, e la
      # scelta finiva scartata in silenzio. Lo riscrive `pubblica.sh`.
      orologio:
        description: "Quali orologi controllare"
        type: choice
        default: tutti
        options:
          - tutti
          - "TAG Heuer Monaco Calibre 11 Steve McQueen — monaco-gulf"
          - "Omega Speedmaster Moonwatch Professional — speedmaster"
          - "Tudor Black Bay Chrono Flamingo Blue — bb-chrono-flamingo"
          - "Tudor Black Bay Chrono Panda — bb-chrono-panda"
          - "Zenith Elite Ultra Thin — zenith-ultrathin"
          - "Vacheron Constantin Historiques 222 — vc-222"
          - "Vacheron Constantin Overseas 41 (4520V) Overseas nuovo — vc-overseas-4520"
          - "Vacheron Constantin Overseas 41 (4500V) Overseas precedente — vc-overseas-4500"
          - "Audemars Piguet Royal Oak Jumbo Extra-Thin Jumbo — royal-oak-jumbo-16202"
          - "Audemars Piguet Royal Oak Selfwinding 41 — royal-oak-15510"
          - "Zenith Chronomaster Revival A384 — el-primero-a384"
          - "Omega Speedmaster Moonwatch Silver Snoopy Award 50th — speedmaster-snoopy"
          - "Panerai Luminor Base Logo quadrante pulito — panerai-base-logo"
          - "Panerai Luminor Marina Logo piccoli secondi — panerai-marina-logo"
          - "Panerai Luminor Marina Militare 1000 pezzi — panerai-marina-militare"
          - "Rolex Land-Dweller 40 — land-dweller-40"
          - "Rolex Land-Dweller 36 — land-dweller-36"
