name: Rolex Radar

on:
  schedule:
    # Orari UTC. In estate (CEST) = 08:00 / 12:00 / 16:00 / 20:00 italiane.
    # In inverno (CET) scalano di un'ora: 07 / 11 / 15 / 19.
    - cron: "0 6,10,14,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Giro di prova senza notifiche"
        type: boolean
        default: false
      force:
        description: "Ignora le ore di silenzio"
        type: boolean
        default: false
      gruppo:
        description: "Quali orologi controllare (gruppo, uno solo, o tutti)"
        type: choice
        default: automatico
        options:
          - automatico
          - 222-overseas-royaloak-elite-snoopy
          - speedmaster-monaco-blackbay-a384
          - tutti
          # oppure un orologio solo:
          - vc-222
          - vc-overseas
          - royal-oak-jumbo-16202
          - royal-oak-15510
          - zenith-ultrathin
          - speedmaster-snoopy
          - speedmaster
          - monaco-gulf
          - bb-chrono-flamingo
          - el-primero-a384
          - bb-chrono-panda
          - panerai-luminor

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il controllo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_HOST:          ${{ secrets.IMAP_HOST }}
          IMAP_USER:          ${{ secrets.IMAP_USER }}
          IMAP_PASS:          ${{ secrets.IMAP_PASS }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          REPORT_TO:          ${{ secrets.REPORT_TO }}
          GRUPPO: ${{ inputs.gruppo }}
          DRY:    ${{ inputs.dry_run }}
          FORCE:  ${{ inputs.force }}
        # Costruire gli argomenti nella shell invece che con le espressioni di
        # GitHub: si legge, si corregge, e non si sbaglia una parentesi.
        run: |
          ARGS=""
          [ "$DRY" = "true" ]   && ARGS="$ARGS --dry-run"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          # Elencare i valori validi qui era una trappola: i gruppi sono stati
          # rinominati e il "a|b" e' rimasto indietro, cosi' la scelta veniva
          # buttata via in silenzio e il giro partiva in rotazione automatica.
          # Ora l'elenco sta in un posto solo, il menu qui sopra.
          case "$GRUPPO" in
            automatico|"") ;;
            tutti)         ARGS="$ARGS --all-watches" ;;
            *)             ARGS="$ARGS --group $GRUPPO" ;;
          esac
          echo "Argomenti: ${ARGS:-nessuno (rotazione automatica)}"
          python -m radar.main check $ARGS

      # I file generati appartengono al bot: se il remoto e' avanzato nel
      # frattempo (un altro giro, o un push dal Mac) git non sa fondere un
      # database binario e si blocca. Qui il conflitto e' previsto e risolto
      # sempre allo stesso modo: vince la versione appena prodotta.
      - name: Salva storico e dashboard
        if: ${{ always() && !inputs.dry_run }}
        run: |
          set -u
          git config user.name  "rolex-radar[bot]"
          git config user.email "actions@github.com"

          git add -A history.db docs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Niente da salvare."
            exit 0
          fi
          MSG="radar: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git commit -m "$MSG"

          # mette da parte i file generati: sono la nostra unica fonte di verita'
          cp history.db      /tmp/history.db
          cp docs/index.html /tmp/index.html

          for tentativo in 1 2 3; do
            git fetch -q origin main
            if git rebase -q origin/main 2>/dev/null; then
              :
            else
              echo "Conflitto sui file generati: tengo la versione di questo giro."
              git rebase --abort 2>/dev/null || true
              git reset -q --hard origin/main
              cp /tmp/history.db history.db
              cp /tmp/index.html docs/index.html
              git add history.db docs/index.html
              git commit -q -m "$MSG"
            fi
            if git push -q; then
              echo "Salvato al tentativo $tentativo."
              exit 0
            fi
            echo "Push respinto, riprovo."
            sleep 5
          done
          echo "Non sono riuscito a salvare dopo tre tentativi." >&2
          exit 1

      - name: Notifica fallimento
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="⚠️ Rolex Radar: il controllo è fallito. Vedi i log su GitHub Actions."
