name: Rolex Radar

on:
  schedule:
    # Orari UTC. In estate (CEST) = 08:00 / 12:00 / 16:00 / 20:00 italiane.
    # In inverno (CET) scalano di un'ora: 07 / 11 / 15 / 19.
    - cron: "0 6,10,14,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Giro di prova senza notifiche"
        type: boolean
        default: false
      force:
        description: "Ignora le ore di silenzio"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il controllo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_HOST:          ${{ secrets.IMAP_HOST }}
          IMAP_USER:          ${{ secrets.IMAP_USER }}
          IMAP_PASS:          ${{ secrets.IMAP_PASS }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          REPORT_TO:          ${{ secrets.REPORT_TO }}
        run: |
          python -m radar.main check \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Salva storico e dashboard
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "rolex-radar[bot]"
          git config user.email "actions@github.com"
          git add -A history.db docs/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "radar: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push

      - name: Notifica fallimento
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="⚠️ Rolex Radar: il controllo è fallito. Vedi i log su GitHub Actions."
