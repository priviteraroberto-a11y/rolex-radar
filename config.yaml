hard_filters:
  # Range di anni ampio: fuori range NON viene scartato, viene solo penalizzato.
  # Serve solo a evitare di raccogliere referenze pre-ceramica per errore.
  min_year: 2018
  max_year: 2027
  # Prezzo oltre il quale l'annuncio è quasi certamente un errore o un "price on
  # request" mal parsato. Non è il tuo budget.
  absolute_max_price_eur: 90000
  absolute_min_price_eur: 12000
  # Scarta gli annunci marcati come venduti / non disponibili.
  exclude_sold: true

# -----------------------------------------------------------------------------
# PREFERENZE — entrano nello scoring, non nell'esclusione.
# -----------------------------------------------------------------------------
preferences:
  target_years: [2025, 2026]      # ideale
  acceptable_years: [2024]        # buono
  tolerated_years: [2023]         # accettabile se il prezzo compensa

  bracelet:
    preferred: jubilee
    other_penalty: -12            # oyster: penalizzato, non escluso

  condition_rank:                 # dal migliore al peggiore
    - unworn
    - new
    - mint
    - like_new
    - excellent
    - very_good
    - good

  # Dove è stata emessa la garanzia. Conta per la rivendibilità in Italia.
  warranty_regions:
    preferred: [IT, SM, EU]
    neutral: [CH, UK, JP, US]
    disliked: [AE, SA, QA, KW, BH, OM, TR, HK]   # penalizzati, NON esclusi

  # DOVE SI TROVA L'OROLOGIO — tre piani, non un punteggio.
  #
  # Non è una preferenza da pesare: è un cancello sulle notifiche. Tu compri
  # andando a vedere l'orologio, quindi un Royal Oak a Singapore non è "meno
  # interessante", è irrilevante — ma il suo prezzo serve per capire il
  # mercato, quindi resta nel database e nell'indice.
  #
  #   home       Italia e San Marino: primo piano, notifiche normali
  #   nearby     Europa: secondo piano, notifica solo se ne vale davvero la pena
  #   (resto)    solo riferimento di prezzo, mai notificato
  #
  # Nota: la garanzia è un'altra cosa ancora. Un orologio a Bologna con
  # garanzia emiratina sta in Italia ma è scomodo da rivendere. Restano due
  # dimensioni separate.
  geography:
    home: [IT, SM]
    nearby: [EU, CH]

  full_set: strongly_preferred    # box + garanzia + cartellino
  never_polished: preferred
  dealer_only: false              # i privati possono essere ottime occasioni

# -----------------------------------------------------------------------------
# BUDGET — usato per il contesto, non come filtro
# -----------------------------------------------------------------------------
budget:
  comfortable_eur: 28000          # sotto questo sei sereno
  stretch_eur: 34000              # sopra questo devi volerlo davvero
  # NB: il 126710BLRO è stato discontinuato ad aprile 2026. Il mercato si è
  # riprezzato verso l'alto. Rivedi questi numeri ogni 2-3 mesi guardando la
  # mediana che il sistema stesso calcola (la trovi in dashboard).

# -----------------------------------------------------------------------------
# FAIR VALUE — motore di stima
# -----------------------------------------------------------------------------
fair_value:
  # Prezzo di partenza usato SOLO finché non ci sono abbastanza annunci nel DB.
  # Riferimento: l'esemplare TIPICO del mercato, cioe' la mediana degli
  # annunci europei osservati — non il pezzo perfetto.
  seed_price_eur: 31000
  # Numero minimo di annunci comparabili per passare alla stima data-driven.
  min_samples: 10
  # Finestra temporale (giorni) degli annunci usati per la mediana.
  lookback_days: 60
  # Moltiplicatori edonici: servono a normalizzare annunci diversi tra loro
  # prima di calcolare la mediana, e poi a ri-adattarla al singolo annuncio.
  multipliers:
    # Stessa logica: il centro e' il 2024, l'anno mediano degli annunci in
    # circolazione, non l'ultimo uscito.
    year:
      2026: 1.12
      2025: 1.05
      2024: 1.00
      2023: 0.96
      2022: 0.93
      _default: 0.89
    # Centrati su "excellent", che e' lo stato piu' dichiarato sul mercato,
    # non su "unworn". Il motivo: l'indice ora nasce dalla mediana degli
    # annunci osservati, cioe' dall'esemplare TIPICO. Se i moltiplicatori
    # partissero dal migliore, un usato in ottime condizioni a prezzo di
    # mercato risulterebbe caro, e le occasioni vere sparirebbero sotto la
    # soglia di notifica. E' successo con il Vacheron di Zorzoli.
    condition:
      unworn: 1.11
      new: 1.11
      mint: 1.07
      like_new: 1.04
      excellent: 1.00
      very_good: 0.94
      good: 0.88
      _default: 0.90
    bracelet:
      jubilee: 1.00
      oyster: 0.97
      _default: 0.99
    full_set:
      true: 1.00
      false: 0.93
    warranty_region:
      IT: 1.02
      EU: 1.01
      CH: 1.00
      UK: 1.00
      JP: 0.99
      US: 0.98
      AE: 0.94
      SA: 0.94
      QA: 0.94
      _default: 0.98
    never_polished:
      true: 1.01
      false: 1.00
  # Soglia per marcare un annuncio come "sotto mercato"
  underpriced_threshold_pct: 4.0

# -----------------------------------------------------------------------------
# SCORING — 0..100
# I pesi sono il massimo punto ottenibile per ciascuna voce.
# -----------------------------------------------------------------------------
scoring:
  # La geografia NON è qui dentro di proposito: è un cancello sulle notifiche,
  # non un ingrediente del punteggio. Così i punteggi restano confrontabili fra
  # paesi, e l'indice di mercato non si deforma.
  weights:
    price_vs_fair: 40      # quanto costa rispetto a quanto vale
    year: 12
    condition: 12
    full_set: 10
    warranty: 8
    bracelet: 6            # fuori dal mondo Rolex conta poco
    seller_trust: 6
    never_polished: 6
  # Un annuncio a fair value esatto prende metà del peso price_vs_fair.
  # Sconto pari a questo valore (%) → punteggio pieno.
  price_full_credit_discount_pct: 10.0
  # Sovrapprezzo pari a questo valore (%) → zero punti sulla voce prezzo.
  price_zero_credit_premium_pct: 12.0

# -----------------------------------------------------------------------------
# NOTIFICHE
# -----------------------------------------------------------------------------
notifications:
  # --- Italia e San Marino: primo piano ---
  min_score: 78                    # soglia per la notifica "annuncio buono"
  # Un annuncio sotto mercato ti arriva SEMPRE, anche con score più basso.
  always_notify_if_underpriced_pct: 6.0

  # --- Europa: secondo piano ---
  # Soglie più alte: raggiungibile, ma deve valerne il viaggio.
  # 88 e non 95: deve restare raggiungibile da un annuncio davvero buono,
  # altrimenti l'Europa diventa muta come il resto del mondo e il "secondo
  # piano" non esiste piu'.
  nearby_min_score: 88
  nearby_underpriced_pct: 15.0

  # --- Resto del mondo ---
  # Raccolto e usato per l'indice di mercato, mai notificato. Mettilo a true
  # se vuoi vedere anche quelli (utile per qualche giorno, poi stanca).
  notify_reference: false

  # Molti annunci non dichiarano dove si trovano. Trattarli come "resto del
  # mondo" significherebbe perdere occasioni italiane mal compilate, quindi
  # finiscono in Europa: notificati, ma con la soglia alta.
  unknown_location_as: nearby
  # Re-notifica su annuncio già visto solo se:
  price_drop_pct: 2.0              # il prezzo scende almeno di questo
  price_drop_abs_eur: 400          #   ...o di questa cifra assoluta
  score_improvement: 6             # o lo score migliora di questo
  # Silenzio notturno (ora locale Europe/Rome)
  quiet_hours: [23, 7]
  max_per_run: 12                  # anti-spam in caso di primo popolamento

# -----------------------------------------------------------------------------
# FONTI
# -----------------------------------------------------------------------------
# type: html   -> scraping diretto con selettori CSS (per siti "aperti")
# type: email  -> ingestione degli alert email che i marketplace ti mandano
#                 (l'unica via affidabile per Chrono24 & co., vedi README)
#
# Usa `python -m radar.main probe` dopo ogni modifica.
# -----------------------------------------------------------------------------
sources:

  # --- Ingestione alert email: la fonte più robusta del sistema --------------
  - name: email_alerts
    type: email
    enabled: true
    imap_host_env: IMAP_HOST
    imap_user_env: IMAP_USER
    imap_pass_env: IMAP_PASS
    mailbox: Radar
    # Ogni mittente aggiunto qui va aggiunto ANCHE al filtro Gmail, altrimenti
    # le mail finiscono in posta in arrivo e il sistema non le vede mai.
    from_contains:
      - chrono24
      - subito           # privati italiani: l'unico canale che li copre
      - ebay
      - catawiki         # aste, molti venditori italiani
      - watchfinder
      - wristler
      - chronohunter
      - watchmaster
      - subito
      - conteorologi
      - edwatch
      - pluswatch
      - eorologi
      - bonanno
      - dellarocca
      - pedretti
      - paselli
    # Guardiamo gli ultimi 7 giorni, non i "non letti".
    #
    # Il filtro per stato di lettura sembrava piu' efficiente ma e' fragile:
    # basta aprire un'email dal telefono prima del giro e quell'annuncio non
    # lo vede piu' nessuno. Era gia' successo con 22 messaggi.
    # La finestra temporale invece non dipende da cosa fai tu, tiene il carico
    # basso lo stesso, e la deduplica per URL evita di rinotificare due volte.
    since_days: 7
    unseen_only: false
    mark_seen: false

  # =========================================================================
  # UNA REGOLA SOPRA TUTTE: si legge il catalogo, non i risultati di una
  # ricerca.
  #
  # Il 11/09 il Vacheron Overseas di Zorzoli era in vetrina a 25.900 € e il
  # radar non lo vedeva. Non era rotto niente: la ricerca del sito restituisce
  # i primi dieci risultati per pertinenza, e quello era l'undicesimo. Nessun
  # errore, nessuna riga nei log, semplicemente un orologio che per il sistema
  # non esisteva.
  #
  # E' lo stesso difetto di elencare le pagine a mano, o di puntare una fonte
  # su una sola marca: funziona finche' non funziona, e quando smette non te
  # lo dice. Trovare qualcosa e' facile; il lavoro e' trovarli tutti e poi
  # scartarli con il punteggio.
  #
  # Quindi, in ordine di preferenza:
  #   1. il catalogo in JSON che il sito usa per disegnarsi
  #      (Shopify: /products.json — WooCommerce: /wp-json/wc/store/v1/products)
  #   2. la pagina che elenca tutto il catalogo
  #   3. una pagina per ogni marca che seguiamo
  # La ricerca per parola chiave e' l'ultima spiaggia, non la prima scelta.
  # =========================================================================

  # --- PlusWatch: 1.550 orologi ---------------------------------------------
  # Prima leggeva `?s={q}`: una ricerca per orologio, e solo quello che la
  # ricerca del sito decideva di mostrare. Ora legge l'API pubblica di
  # WooCommerce, che restituisce il catalogo intero.
  #
  # `_fields` non e' un vezzo: senza, ogni pagina pesa 4,6 MB perche' porta
  # dentro il `srcset` di ogni immagine. Con, ne pesa 52 KB. Il prezzo di
  # questa scelta e' che le immagini non arrivano, e in dashboard queste
  # schede restano senza foto.
  - name: pluswatch
    type: json
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    base_url: "https://www.pluswatch.it"
    start_urls:
      - "https://www.pluswatch.it/wp-json/wc/store/v1/products?per_page=100&page={page}&_fields=id,name,permalink,prices,is_in_stock,sku,description"
    paginate: {max: 25}
    items_path: ""
    available_value: "true"
    # Qui il prezzo arriva in centesimi (220000 = 2.200 €). Su Bonanno arriva
    # in euro interi. Lo dice `currency_minor_unit`, dentro la risposta: e'
    # per questo che la scala si legge dal dato e non si scrive qui.
    price_scale_from: "prices.currency_minor_unit"
    fields:
      title: name
      price: "prices.price"
      available: is_in_stock
      reference: sku
      # Senza questa riga il punteggio crolla, ed e' successo davvero.
      # Qui dentro stanno anno di garanzia, stato del vetro e del bracciale,
      # cinturino originale, condizione della scatola: meta' di quello che il
      # punteggio guarda. Toglierla per alleggerire il download ha portato un
      # Monaco da 92 a 43 punti in un solo giro.
      description: description
      url: permalink

  # --- Universo Oro (Roma) ---------------------------------------------------
  # Non e' una pagina HTML ma il catalogo in JSON che il sito usa per
  # disegnarsi da solo. Letto come pagina mostrerebbe 4 orologi su 127: e'
  # scritto in JavaScript e senza browser non si vede quasi niente.
  #
  # Vale piu' di tutte le altre fonti messe insieme, perche' i campi arrivano
  # gia' separati: niente prezzo barrato da distinguere, niente prodotti
  # correlati che inquinano l'anno, niente selettori da indovinare.
  #
  # Due richieste in tutto per 127 orologi, meno di una singola ricerca HTML.
  - name: universooro
    type: json
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    base_url: "https://www.universo-oro.it"
    # `{page}` e non due righe fisse: oggi il catalogo sta in due pagine, ma
    # il giorno che passa da 121 a 210 orologi le due righe ne coprirebbero
    # 200 e le altre dieci sparirebbero senza un errore. Il ciclo si ferma da
    # solo quando una pagina torna vuota.
    start_urls:
      - "https://www.universo-oro.it/api/public/watches?page={page}&limit=100"
    paginate: {max: 20}
    items_path: items
    available_value: available
    fields:
      title: "{brand} {model} {referenceNumber}"
      reference: referenceNumber
      price: pricePublic
      year: yearOfProduction
      condition: condition
      box: hasBox
      papers: hasPapers
      available: availability
      image: primaryImage
      url: "https://www.universo-oro.it/orologi/{id}"

  # --- Zorzoli Orologi (Pavia): 716 orologi ---------------------------------
  # E' la fonte che ha insegnato la regola scritta sopra.
  #
  # Leggeva `/search/suggest.json?...&resources[limit]=10`: i primi dieci
  # risultati per pertinenza. Il Vacheron Overseas a 25.900 € era in vetrina
  # e il radar diceva "nessun riscontro", perche' arrivava undicesimo. Peggio:
  # l'ordinamento per pertinenza cambia, quindi lo stesso orologio entrava e
  # usciva dal database da un giro all'altro, e in dashboard sembrava venduto.
  #
  # Ora legge `/products.json`, che e' il catalogo intero: 716 schede in tre
  # pagine, 1,7 MB, scaricate una volta per giro e usate per tutti e dodici
  # gli orologi. Costa meno delle dodici ricerche di prima.
  #
  # Due cose da sapere su questo catalogo:
  #   - **663 delle 716 schede sono gia' vendute.** Il negozio tiene online lo
  #     storico. Senza `available` verrebbero tutte prese per disponibili.
  #   - **il titolo non contiene la referenza**: "Vacheron Constantin
  #     Overseas" e basta. Referenza, anno, condizione e corredo stanno in
  #     `body_html`, in mezzo ai tag. Per questo c'e' `description`.
  - name: zorzoli
    type: json
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    base_url: "https://zorzoliorologi.com"
    start_urls:
      - "https://zorzoliorologi.com/collections/i-nostri-orologi/products.json?limit=250&page={page}"
    paginate: {max: 12}
    items_path: products
    available_value: "true"
    fields:
      title: title
      description: body_html
      price: "variants.0.price"
      available: "variants.0.available"
      image: "images.0.src"
      url: "https://zorzoliorologi.com/products/{handle}"

  # --- della Rocca (Milano) --------------------------------------------------
  # Qui c'era il buco piu' grosso, e il piu' invisibile: la fonte leggeva UNA
  # pagina, "Rolex Professionali". Da quando il Rolex Pepsi e' uscito dai
  # modelli seguiti, questa fonte non poteva piu' restituire niente di utile,
  # per costruzione — e continuava a rispondere "ok" a ogni giro.
  #
  # Il sito ha una pagina per marca. Ci sono tutte quelle che ci servono, e
  # sono queste. Se un giorno aggiungi un Patek o un IWC, la pagina va
  # aggiunta qui: `o_3-Patek+Philippe.php`, `o_21-Iwc.php`.
  #
  # I selettori di prima (`div.prodotto`) non esistevano su questo sito: il
  # contenitore vero e' `div.box_lista_prodotti2`.
  - name: dellarocca
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    start_urls:
      # Rolex e' tornato fra i marchi seguiti col Land-Dweller (12/09).
      - "https://www.dellaroccagioielli.it/o_32-Rolex+Professionali.php"
      - "https://www.dellaroccagioielli.it/o_31-Rolex+Oyster.php"
      - "https://www.dellaroccagioielli.it/o_9-Audemars+Piguet.php"
      - "https://www.dellaroccagioielli.it/o_24-Vacheron+Constantin.php"
      - "https://www.dellaroccagioielli.it/o_4-Omega.php"
      - "https://www.dellaroccagioielli.it/o_25-Zenith.php"
      - "https://www.dellaroccagioielli.it/o_23-Tudor.php"
      - "https://www.dellaroccagioielli.it/o_22-Tag+Heuer.php"
      - "https://www.dellaroccagioielli.it/o_5-Officine+Panerai.php"
    item_selector: "div.box_lista_prodotti2"
    fields:
      title: "h3, h2, a"
      price: ".prezzo, .price"
      url: "a@href"
      image: "img@src"

  # --- Davide Pedretti: 28 orologi ------------------------------------------
  # Catalogo piccolo, quindi la ricerca sbagliava di rado — ma sbagliava allo
  # stesso modo. Una pagina sola di API e c'e' tutto.
  - name: davidepedretti
    type: json
    enabled: true
    country: IT
    dealer: true
    seller_trust: 5
    base_url: "https://shop.davidepedretti.com"
    start_urls:
      - "https://shop.davidepedretti.com/wp-json/wc/store/v1/products?per_page=100&page={page}&_fields=id,name,permalink,prices,is_in_stock,sku,description"
    paginate: {max: 10}
    items_path: ""
    available_value: "true"
    price_scale_from: "prices.currency_minor_unit"
    fields:
      title: name
      price: "prices.price"
      available: is_in_stock
      reference: sku
      # Senza questa riga il punteggio crolla, ed e' successo davvero.
      # Qui dentro stanno anno di garanzia, stato del vetro e del bracciale,
      # cinturino originale, condizione della scatola: meta' di quello che il
      # punteggio guarda. Toglierla per alleggerire il download ha portato un
      # Monaco da 92 a 43 punti in un solo giro.
      description: description
      url: permalink

  # --- VERIFICATO A MANO: ha 3 Pepsi 126710BLRO a catalogo -------------------
  # --- Conte Orologi (Roma): 1.227 orologi ----------------------------------
  # Non e' WooCommerce e non ha API. Ma `/orologi/` e' una pagina sola,
  # renderizzata dal server, che contiene TUTTO il catalogo: 1.227 schede,
  # ognuna con titolo, referenza, prezzo e disponibilita' gia' separati.
  # Un megabyte, una richiesta per giro.
  #
  # I selettori di prima (`li.product`) non trovavano niente: il tema e' fatto
  # su misura e il contenitore si chiama `.box_orologio`.
  #
  # `max_detail` conta: senza, il radar aprirebbe 1.227 schede a ogni giro.
  # Con, ne apre solo quelle che nominano un orologio seguito.
  - name: conteorologi
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    start_urls:
      - "https://www.conteorologi.it/orologi/"
    item_selector: ".box_orologio"
    max_detail: 30
    fields:
      title: ".titolo a, .titolo"
      price: ".prezzo"
      url: ".titolo a@href, a@href"
      image: "img@src"

  # --- L'Orologiaio di Corte (Bologna) --------------------------------------
  # Stesso difetto di della Rocca: `catId=2` e' la pagina **Rolex**, l'unica
  # che veniva letta, mentre Rolex non era piu' fra i marchi seguiti. Ora ci
  # sono tutte le categorie che servono — Rolex compreso, che col Land-Dweller
  # e' rientrato.
  - name: lorologiaiodicorte
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 3
    start_urls:
      - "https://www.lorologiaiodicorte.it/?catId=2"    # Rolex
      - "https://www.lorologiaiodicorte.it/?catId=26"   # Audemars Piguet
      - "https://www.lorologiaiodicorte.it/?catId=9"    # Vacheron Constantin
      - "https://www.lorologiaiodicorte.it/?catId=10"   # Omega
      - "https://www.lorologiaiodicorte.it/?catId=15"   # Zenith
      - "https://www.lorologiaiodicorte.it/?catId=1"    # Tudor
      - "https://www.lorologiaiodicorte.it/?catId=12"   # Tag Heuer
      - "https://www.lorologiaiodicorte.it/?catId=17"   # Panerai
    item_selector: ".product, .card, .item, .col-md-4, .col-lg-4"
    fields:
      title: "h6, h5, h2, a"
      price: ".price, .prezzo"
      url: "a@href"
      image: "img@src"

  # --- Gioielleria Bonanno (Catania): 800 orologi ---------------------------
  # Il secondo dominio, bonannovintage.it, e' vuoto: risponde ma non ha
  # catalogo. Tolto.
  #
  # Attenzione a questo catalogo: 370 schede su 800 hanno prezzo 0, che qui
  # vuol dire "prezzo su richiesta". Zero non e' un prezzo basso, e' un prezzo
  # che non c'e': verrebbe fuori l'affare del secolo su ogni scheda. Il
  # lettore JSON scarta i prezzi non positivi, ed e' l'unica ragione per cui
  # questa fonte si puo' accendere.
  #
  # E qui il prezzo arriva in euro interi (`currency_minor_unit: 0`), non in
  # centesimi come PlusWatch. Stesso software, scala diversa.
  - name: bonanno
    type: json
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    base_url: "https://www.gioielleriabonanno.it"
    start_urls:
      - "https://www.gioielleriabonanno.it/wp-json/wc/store/v1/products?per_page=100&page={page}&_fields=id,name,permalink,prices,is_in_stock,sku,description"
    paginate: {max: 20}
    items_path: ""
    available_value: "true"
    price_scale_from: "prices.currency_minor_unit"
    fields:
      title: name
      price: "prices.price"
      available: is_in_stock
      reference: sku
      # Senza questa riga il punteggio crolla, ed e' successo davvero.
      # Qui dentro stanno anno di garanzia, stato del vetro e del bracciale,
      # cinturino originale, condizione della scatola: meta' di quello che il
      # punteggio guarda. Toglierla per alleggerire il download ha portato un
      # Monaco da 92 a 43 punti in un solo giro.
      description: description
      url: permalink

  # --- Ed Watch: 104 orologi ------------------------------------------------
  # Prima leggeva `?s={q}` e la conclusione scritta qui era "hanno solo Batman
  # e Sprite, quindi 0 pertinenti e' il risultato corretto". Era una
  # conclusione tratta da cio' che la ricerca mostrava. Il catalogo vero ne ha
  # 104, in due pagine.
  - name: edwatch
    type: json
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    base_url: "https://edwatch.it"
    start_urls:
      - "https://edwatch.it/wp-json/wc/store/v1/products?per_page=100&page={page}&_fields=id,name,permalink,prices,is_in_stock,sku,description"
    paginate: {max: 10}
    items_path: ""
    available_value: "true"
    price_scale_from: "prices.currency_minor_unit"
    fields:
      title: name
      price: "prices.price"
      available: is_in_stock
      reference: sku
      # Senza questa riga il punteggio crolla, ed e' successo davvero.
      # Qui dentro stanno anno di garanzia, stato del vetro e del bracciale,
      # cinturino originale, condizione della scatola: meta' di quello che il
      # punteggio guarda. Toglierla per alleggerire il download ha portato un
      # Monaco da 92 a 43 punti in un solo giro.
      description: description
      url: permalink

  # Spenta: /?s=126710 non estrae nulla, /orologi/ e /shop/ danno 404.
  # Il loro sito non espone un catalogo leggibile. Da coprire con newsletter.
  - name: tempoprezioso
    type: html
    enabled: false
    country: IT
    dealer: true
    seller_trust: 3
    start_urls:
      - "https://www.tempopreziosobologna.com/?s={q}"
      - "https://www.tempopreziosobologna.com/orologi/"
      - "https://www.tempopreziosobologna.com/shop/"
    item_selector: "li.product, .product, article"
    fields:
      title: "h2, h3, .woocommerce-loop-product__title"
      price: ".price, .amount"
      url: "a@href"
      image: "img@src"

  # --- Candidati italiani da verificare col probe ---------------------------
  # VERIFICATO: a catalogo c'è un 126710BLRO. Griglia costruita con Elementor,
  # quindi niente <li class="product">: i selettori sono volutamente larghi.
  # Spenta il 16/08: il certificato SSL del sito non e' valido per il proprio
  # dominio e la connessione fallisce. Ogni tentativo costa ~2 minuti di
  # timeout PER OGNI orologio. Riaccendila quando avranno sistemato.
  - name: eorologi
    type: html
    enabled: false
    country: IT
    dealer: true
    seller_trust: 3
    start_urls:
      - "https://eorologi.com/?s={q}&post_type=product"
    item_selector: >
      li.product, .product, .type-product, article.product,
      .elementor-widget-woocommerce-products li, .products > li
    fields:
      title: >
        h2, h3, .woocommerce-loop-product__title,
        .elementor-heading-title, a@title
      price: ".price, .amount, .woocommerce-Price-amount"
      url: "a@href"
      image: "img@src"

  - name: loradelgallo
    type: html
    enabled: false   # 0 elementi estratti: sito non WooCommerce
    country: IT
    dealer: true
    seller_trust: 3
    start_urls:
      - "https://www.loradelgallo.com/?s=126710&post_type=product"
    item_selector: "li.product, .product, article"
    fields:
      title: "h2, h3, .woocommerce-loop-product__title"
      price: ".price, .amount"
      url: "a@href"
      image: "img@src"

  # Orologi Famosi (Medicina, BO)
  - name: orologifamosi
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 3
    # Terza fonte puntata solo su Rolex, terza corretta. Qui i cataloghi di
    # marca sono paginati (`/catalogo/omega-2/2`, `/3`...), quindi `{page}`.
    # La prima pagina non ha il numero, e infatti la serie parte da 1 e
    # `/catalogo/omega-2/1` esiste. Il ciclo si ferma quando una pagina non
    # porta niente di nuovo.
    #
    # Non hanno Vacheron ne' Audemars Piguet ne' Panerai: quelle marche qui
    # non ci sono proprio, e non e' un errore da inseguire.
    # Le schede stanno su /scheda/..., gli esauriti sono marcati "Venduto".
    start_urls:
      - "https://www.venditaorologiusati.it/catalogo/rolex-1/{page}"
      - "https://www.venditaorologiusati.it/catalogo/omega-2/{page}"
      - "https://www.venditaorologiusati.it/catalogo/tudor-5/{page}"
      - "https://www.venditaorologiusati.it/catalogo/tag-heuer-3/{page}"
      - "https://www.venditaorologiusati.it/catalogo/zenith-10/{page}"
    paginate: {max: 15}
    # Il commento di prima diceva "il catalogo risponde ma non estrae:
    # probabilmente renderizzato in JS". Era sbagliato, e vale la pena dire
    # perche': i link delle schede sono scritti **relativi**
    # (`scheda/omega-...`, senza barra iniziale), quindi il selettore
    # `a[href*="/scheda/"]` non li trovava e sembrava una pagina vuota.
    # Le schede ci sono tutte, nell'HTML, gia' pronte.
    item_selector: ".col-lg-4.marginbot-l, .col-md-4.marginbot-l"
    fields:
      title: ".carat1b, .carat1b strong"
      price: ".carat1x"
      url: "a@href"
      image: "img.w100@src"

  # --- Spente: verificate come non utilizzabili ------------------------------
  # orologiepassioni.com restituisce una pagina vuota (sito JS o dismesso).
  - name: orologiepassioni
