# =============================================================================
# ROLEX RADAR — configurazione
# Il cuore del sistema. Il codice non si tocca: si tocca questo file.
# =============================================================================

# -----------------------------------------------------------------------------
# ROTAZIONE
# Otto orologi per dieci fonti fanno un giro lungo. La rotazione ne controlla
# un gruppo per volta, alternandoli: ogni orologio viene guardato ogni due
# giri, cioe' comunque due volte al giorno.
#
# Il gruppo di turno si sceglie da solo in base all'ora, quindi i giri delle
# 8/12/16/20 alternano a - b - a - b senza bisogno di ricordare nulla.
#
# `group: always` = controllato a ogni giro, senza aspettare il turno.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Qui c'era la ROTAZIONE: gli orologi divisi in due turni, uno per giro.
#
# Serviva quando ogni orologio costava una ricerca su ogni sito — dodici
# orologi per dieci fonti facevano centoventi interrogazioni. Da quando le
# fonti leggono il catalogo intero, quel conto non esiste piu': il catalogo di
# un negozio si scarica una volta per giro e vale per tutti gli orologi
# insieme. Quindici costano quasi quanto sette.
#
# Tolta il 12/09/2026. Dimezzava la copertura senza far risparmiare quasi
# niente, e aveva un difetto suo: un annuncio comparso e sparito durante il
# turno sbagliato non lo vedeva nessuno.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# OROLOGI MONITORATI
# Aggiungere un orologio = aggiungere una voce a questa lista.
# Ogni voce eredita tutte le impostazioni globali piu' in basso, e ridefinisce
# solo quelle che le servono. Cosi' un Vacheron puo' avere la sua banda di
# prezzo e la sua curva di deprezzamento senza duplicare l'intero file.
#
# Campi obbligatori: id, references. Tutto il resto e' facoltativo.
#
# `photo:` e' l'immagine mostrata in dashboard. Se la lasci vuota, il sistema
# usa la foto di uno degli annunci trovati; finche' non ce ne sono, disegna un
# segnaposto con le iniziali. Per metterne una tua: apri l'orologio su un sito
# qualsiasi, tasto destro sull'immagine -> "Copia indirizzo immagine".
# -----------------------------------------------------------------------------
watches:

  # ---------------------------------------------------------------------------
  # NOTA SUI PREZZI DI PARTENZA — rivisti il 15/08/2026
  # Le mie prime stime erano basse del 20-40% rispetto ai prezzi richiesti
  # davvero dai dealer italiani: tre su tre sbagliate nella stessa direzione.
  # Ho corretto quelle verificate sui dati e alzato le altre in proporzione,
  # ma restano stime. Servono solo
  # finché il database non raccoglie 10 annunci comparabili. Per gli orologi
  # ancora sul seed ho alzato la soglia "sotto mercato" al 15%: con una stima
  # incerta non ha senso gridare all'affare per uno scarto del 6%.
  # Correggili quando vedi i primi prezzi veri in dashboard.
  # ---------------------------------------------------------------------------

  # ATTENZIONE ALL'ID: si chiama `monaco-gulf` ma questo **non e' il Gulf**.
  #
  # CAW211P.FC6356 e' il Monaco Calibre 11 blu "Steve McQueen", senza strisce.
  # Il Gulf vero — quello blu e arancio — porta altre referenze: CAW211R.FC6401
  # e CAW2113 (Calibre 11), CBL2115 (serie recente). Il radar non le ha mai
  # cercate, e l'etichetta diceva "Gulf" a un orologio che Gulf non e'.
  #
  # Scoperto il 12/09/2026 confrontando le ricerche salvate su Chrono24 con le
  # referenze: `Monaco Gulf CAW211P` su Chrono24 dava **zero** risultati,
  # perche' quelle tre parole insieme non stanno in nessun annuncio.
  #
  # L'id resta `monaco-gulf` anche se e' fuorviante: cambiarlo staccherebbe
  # dal database tutto lo storico di questo orologio, ed e' un prezzo piu' alto
  # di un nome scomodo. Quello che conta — etichetta, referenza, ricerca — e'
  # corretto.
  - id: monaco-gulf
    # photo: "https://..."
    brand: TAG Heuer
    model: Monaco Calibre 11
    nickname: Steve McQueen
    references: ["CAW211P.FC6356"]
    reference_stems: ["CAW211P"]
    search_terms: ["CAW211P", "Monaco Steve McQueen"]
    model_keywords: ["Monaco"]
    # "Gulf" fra le escluse e' una rete di sicurezza, non il filtro vero: a
    # tenerlo fuori basta la referenza, che e' esatta. Ma un Gulf che finisse
    # in questo indice lo abbasserebbe di circa mille euro.
    exclude_keywords: ["Carrera", "Formula 1", "Aquaracer", "Gulf"]
    hard_filters:
      min_year: 2015
      max_year: 2027
      absolute_min_price_eur: 2000
      absolute_max_price_eur: 14000
    preferences:
      target_years: [2024, 2025, 2026]
      acceptable_years: [2022, 2023]
      tolerated_years: [2020, 2021]
    # FUORI PRODUZIONE: TAG Heuer oggi fa solo la versione in titanio con la
    # corona a sinistra. Un listino attuale per questo non esiste, quindi il
    # radar non scrive niente invece di confrontarti con un prezzo che non c'e'.
    fair_value:
      # mediana UE 7.100 su 19 annunci (rilevazione 12/09/2026). Conferma la
      # stima che c'era (7.000, osservata su PlusWatch).
      #
      # Nota metodo: la stessa ricerca senza filtro geografico dava 6.397, e
      # sarebbe stata una stima sbagliata per difetto — sotto ci sono Hong Kong
      # e Giappone, dove il prezzo non e' confrontabile perche' all'importazione
      # si aggiunge il 27,5% fra dazio e IVA.
      seed_price_eur: 7100
    notifications:
      always_notify_if_underpriced_pct: 15.0

  - id: speedmaster
    # photo: "https://..."
    brand: Omega
    model: Speedmaster Moonwatch Professional
    references: ["310.30.42.50.01.002"]
    # La radice si ferma prima dell'ultimo gruppo, che e' quello che distingue
    # le due versioni: ...01.001 e' l'Hesalite, ...01.002 e' lo zaffiro.
    # Cosi' entrano anche gli annunci che scrivono solo "Speedmaster Moonwatch
    # 42mm" senza suffisso, che sono la maggioranza.
    reference_stems: ["310.30.42.50.01"]
    # ...e questa li richiude quando il venditore dichiara l'Hesalite.
    # Tre stati, non due: 002 esplicito entra, nessuno dei due entra lo
    # stesso, 001 esplicito esce. Vuoi solo lo zaffiro, ma non al prezzo di
    # perdere tutti gli annunci scritti male.
    exclude_references: ["310.30.42.50.01.001"]
    search_terms: ["310.30.42.50.01.002", "Speedmaster Moonwatch"]
    model_keywords: ["Speedmaster", "Moonwatch"]
    exclude_keywords: ["Seamaster", "Constellation", "Snoopy", "Dark Side", "Reduced"]
    hard_filters:
      min_year: 2021
      max_year: 2027
      absolute_min_price_eur: 3000
      absolute_max_price_eur: 14000
    preferences:
      target_years: [2025, 2026]
      acceptable_years: [2023, 2024]
      tolerated_years: [2021, 2022]
    fair_value:
      # mediana UE 6.800 su 30 annunci Chrono24 (rilevazione 03/09/2026)
      seed_price_eur: 6800
      # Listino Omega 2026, versione vetro zaffiro. Dato fornito da Roberto.
      list_price_eur: 8900
    notifications:
      always_notify_if_underpriced_pct: 15.0

  - id: bb-chrono-flamingo
    brand: Tudor
    model: Black Bay Chrono
    nickname: Flamingo Blue
    # Riconosciuto per NOME, e la ragione e' un errore che stavo per farti fare.
    #
    # La referenza 79360N copre tre orologi diversi con prezzi che non si
    # somigliano affatto: il Flamingo Blue (-0024) sta sui 7.800, il Panda
    # (-0002) sui 4.300, il Pink "Inter Miami" (-0019) sui 7.500. Con la
    # radice "79360N" finivano tutti nello stesso indice, e un Panda a prezzo
    # di listino sembrava un Flamingo regalato: e' esattamente quello che mi
    # ha fatto scambiare per un affare il Tudor da 4.500 di Universo Oro.
    identify_by: name
    must_include: ["Flamingo"]
    references: ["M79360N-0024"]
    search_terms: ["79360N-0024", "Black Bay Chrono Flamingo"]
    exclude_keywords: ["Pink", "Inter Miami", "Miami", "Panda", "Reverse"]
    hard_filters:
      min_year: 2023
      max_year: 2027
      absolute_min_price_eur: 3500
      absolute_max_price_eur: 16000
    preferences:
      target_years: [2024, 2025, 2026]
      acceptable_years: [2023]
    fair_value:
      # mediana UE 7.845 su 7 annunci (rilevazione 03/09/2026)
      seed_price_eur: 7900
      # listino Tudor per il Flamingo Blue (turchese)
      list_price_eur: 6480
    notifications:
      always_notify_if_underpriced_pct: 12.0

  # Il fratello economico, separato di proposito: costa la meta' e mescolarlo
  # al Flamingo rendeva senza senso l'indice di tutti e due.
  - id: bb-chrono-panda
    brand: Tudor
    model: Black Bay Chrono
    nickname: Panda
    references: ["M79360N-0002"]
    reference_stems: ["79360N"]
    search_terms: ["79360N", "Black Bay Chrono"]
    # "Giallo"/"Yellow" e' il quarto quadrante sotto la stessa referenza
    # 79360N: quello che da Zorzoli sta a 8.000 € contro i 4.330 di mediana
    # del Panda. Da solo spostava l'indice di tutti gli altri.
    #
    # Una parola che NON va messa qui: "opalino". Il negozio lo descrive come
    # "quadrante opalino con contatori giallo" — ma guardando la foto il
    # quadrante e' giallo pieno con i contatori neri, e "opalino" e' proprio
    # come si descrive il Panda. Escludendo quella parola avremmo cancellato
    # l'orologio che cerchi, e nei log sarebbe sembrato che il mercato fosse
    # semplicemente vuoto.
    exclude_keywords: ["Flamingo", "Pink", "Inter Miami", "Miami"]
    # E deve valere anche quando la parola sta solo nella descrizione: il
    # titolo di tutti e quattro i quadranti e' "Tudor Black Bay Chrono", e da
    # li' non si distingue niente.
    exclude_in_text: ["Giallo", "Yellow"]
    hard_filters:
      min_year: 2021
      max_year: 2027
      absolute_min_price_eur: 1900
      absolute_max_price_eur: 9000
    preferences:
      target_years: [2024, 2025, 2026]
      acceptable_years: [2022, 2023]
      tolerated_years: [2021]
    fair_value:
      # mediana UE 4.330 su 31 annunci (rilevazione 03/09/2026)
      seed_price_eur: 4330
      # listino Tudor per il Panda
      list_price_eur: 6360
    notifications:
      always_notify_if_underpriced_pct: 12.0

  - id: zenith-ultrathin
    # photo: "https://..."
    brand: Zenith
    model: Elite Ultra Thin
    # Riconosciuto dal NOME, non dalla referenza.
    #
    # Nessuno vende questo orologio citando la referenza completa: su Chrono24
    # compare come "Zenith Elite Classic Automatic Ultra Thin". Cercare una
    # referenza in quel titolo non trova mai niente, ed e' il motivo per cui
    # il radar diceva "nessun annuncio" mentre su Chrono24 ce n'erano quattro.
    #
    # `must_include` = una sola parola, di proposito. Con "Elite" + "Ultra
    # Thin" restavano fuori l'Elite 6150 e l'Elite Classic 33mm, che sono la
    # stessa famiglia scritta in altro modo. Hai chiesto di prenderne qualcuno
    # in piu' piuttosto che in meno: il lavoro di scarto lo fanno le parole
    # escluse qui sotto e il punteggio.
    identify_by: name
    must_include: ["Elite"]
    references: []
    search_terms: ["Zenith Elite", "Zenith Elite Ultra Thin"]
    model_keywords: ["Elite", "Ultra Thin", "Ultrathin"]
    # "Elite" e' anche il nome del calibro, e finisce nelle schede di modelli
    # che non c'entrano: senza queste esclusioni entrerebbe mezzo catalogo.
    exclude_keywords: ["Defy", "Pilot", "Chronomaster", "Captain", "Port Royal",
                       "El Primero", "Rainbow", "Academy", "Star ", "Stratos"]
    # Banda larga: i tre annunci veri stanno fra 3.490 e 4.300 euro, e la
    # vecchia soglia minima di 4.000 ne avrebbe scartati due su tre.
    hard_filters:
      min_year: 2005
      max_year: 2027
      absolute_min_price_eur: 1500
      absolute_max_price_eur: 12000
    preferences:
      target_years: [2022, 2023, 2024, 2025, 2026]
      acceptable_years: [2016, 2017, 2018, 2019, 2020, 2021]
      tolerated_years: [2010, 2011, 2012, 2013, 2014, 2015]
    fair_value:
      # Osservati su Chrono24 Italia il 26/08/2026: 3.490, 3.500, 4.300 euro.
      # La mia stima precedente era 12.500: sbagliata di tre volte e mezzo,
      # perche' l'avevo dedotta da una referenza che mi ero inventato. Con
      # quella, ogni annuncio sarebbe sembrato un affare del 70%.
      # Sono tre modelli diversi fra loro, quindi e' una mediana grossolana:
      # servira' finche' il database non raccoglie annunci veri.
      # mediana UE 3.490 su 60 annunci (rilevazione 03/09/2026)
      seed_price_eur: 3500
    notifications:
      # 12% invece di 20: ora la stima poggia su prezzi osservati, non su
      # un'ipotesi, e puo' permettersi una soglia piu' stretta.
      always_notify_if_underpriced_pct: 12.0

  - id: vc-222
    # photo: "https://..."
    brand: Vacheron Constantin
    model: Historiques 222
    references: ["4200H/222A-B934"]
    # SOLO ACCIAIO (12/09/2026). Prima la radice nuda `4200H` prendeva anche
    # l'oro giallo 4200H/222J-B935, e il commento diceva che era voluto — "non
    # nasconderlo se capita a un buon prezzo". Era un'intenzione che non
    # funzionava: l'indice di questo orologio e' costruito sull'acciaio
    # (52.000), quindi un oro a 66.000 risultava sempre caro. Un oro davvero
    # in saldo sarebbe stato archiviato come fuori prezzo, e intanto quelli a
    # prezzo pieno alzavano la mediana degli acciai.
    #
    # La radice resta larga — meta' degli annunci scrive solo "222" o "4200H"
    # — e a togliere l'oro ci pensa la referenza esclusa, che e' esatta.
    reference_stems: ["4200H"]
    exclude_references: ["4200H/222J", "4200H/222R", "4200H/222G"]
    search_terms: ["4200H", "Historiques 222"]
    model_keywords: ["222", "Historiques"]
    # Niente "Oro" o "Gold" fra le parole escluse, per due motivi.
    #
    # Il primo: non funzionerebbe. Su 10 annunci in oro trovati oggi in UE,
    # **4 non nominano il materiale nel titolo**: si chiamano "Historiques
    # 222" e basta, a 66.720, 71.800 e 86.800 euro. Le parole non li prendono.
    #
    # Il secondo: farebbe danni altrove. Fra le fonti c'e' un negozio che si
    # chiama **Universo Oro**, e un titolo che finisse per contenere il nome
    # del negozio verrebbe scartato per la parola sbagliata.
    exclude_keywords: ["Overseas", "Patrimony", "Traditionnelle", "Fiftysix",
                       "222J", "Oro giallo", "Yellow gold", "Gelbgold",
                       "Or jaune", "18K", "18 K"]
    hard_filters:
      min_year: 2022
      max_year: 2027
      # Minimo abbassato da 40.000: con la stima corretta a ~52.000, una
      # soglia a 40.000 avrebbe scartato in silenzio proprio l'affare vero.
      absolute_min_price_eur: 25000
      absolute_max_price_eur: 160000
    preferences:
      target_years: [2025, 2026]
      acceptable_years: [2023, 2024]
      tolerated_years: [2022]
    fair_value:
      # Corretta il 26/08/2026 sui prezzi di mercato: l'acciaio si vende fra
      # 47.000 e 60.000 euro, non 105.000. L'errore era dello stesso tipo
      # dello Zenith — una stima dedotta invece che osservata — e produceva
      # l'effetto peggiore: ogni annuncio normale sembrava un affare del 50%.
      # L'unico annuncio visto finora, giapponese, chiedeva 45.353 euro.
      #
      # mediana UE 51.950 su 11 annunci in ACCIAIO (rilevazione 12/09/2026),
      # tutti fra 47.500 e 55.000. Sostituisce i 9 campioni del 03/09, che
      # erano in gran parte gli stessi annunci ancora online: tenerli tutti e
      # due avrebbe contato nove prezzi due volte.
      seed_price_eur: 52000
      # listino Vacheron: CHF 32.200 al cambio 1,0635 del 05/09/2026
      list_price_eur: 34250
      # Tabelle centrate su questo mercato, come per il Land-Dweller.
      # Gli 11 annunci in acciaio sono quasi tutti "Unworn" o "Full set" del
      # 2025-2026: l'esemplare tipico e' un nuovo recente, ed e' quello che
      # l'indice misura. Con le tabelle generali (1,05 per il 2025 e 1,11 per
      # il "nuovo") un 222 a prezzo pieno di mercato risultava il 14% sotto il
      # valore equo: 81 punti su 100 e una notifica, per un annuncio normale.
      multipliers:
        year:
          2026: 1.00
          2025: 1.00
          2024: 0.98
          _default: 0.96
        condition:
          unworn: 1.00
          new: 1.00
          mint: 0.99
          like_new: 0.98
          excellent: 0.96
          very_good: 0.92
          good: 0.88
          _default: 0.98
    notifications:
      always_notify_if_underpriced_pct: 15.0

  # I due Overseas 41 in acciaio, tenuti separati come i due Royal Oak.
  #
  # Sono lo stesso orologio a una generazione di distanza — 41 mm, acciaio,
  # tre cinturini — ma non lo stesso mercato: rilevazione Chrono24 UE dell'11
  # settembre, 27.700 € di mediana il 4500V contro 34.000 € il 4520V. Un
  # indice solo per entrambi si sarebbe piazzato in mezzo, e avrebbe detto a
  # ogni 4500V che e' un affare e a ogni 4520V che e' caro.
  #
  # E attenzione alle due lettere dopo la barra, che qui sono il materiale
  # esattamente come `ST` in Audemars Piguet:
  #   4520V/**210A** e 4500V/**110A** = acciaio, 30-35.000 €
  #   4520V/**210R** e 4500V/**000R** = oro rosa, 60-64.000 €
  # La radice nuda (`4520V`) le prende tutte e due. La teniamo lo stesso —
  # meta' dei venditori scrive solo quella, e perdere un acciaio vero costa
  # piu' che scartare a mano un oro — con due reti sotto: le referenze escluse
  # e le parole dell'oro.
  #
  # Avevo messo anche un tetto di prezzo sotto il primo oro rosa, e un test
  # l'ha bocciato: e' la regola, gia' scritta sul Royal Oak, che il tetto non
  # deve fare da filtro sul materiale. Se il mercato dell'acciaio sale, un
  # tetto stretto comincia a tagliare via acciai veri, in silenzio. Il
  # materiale lo decide la referenza, che e' un filtro esatto.
  - id: vc-overseas-4520
    # photo: "https://..."
    brand: Vacheron Constantin
    model: Overseas 41 (4520V)
    nickname: Overseas nuovo
    references: ["4520V/210A-B128"]
    reference_stems: ["4520V"]
    exclude_references: ["4520V/210R", "4520V/210T", "4520V/000R"]
    search_terms: ["4520V", "Overseas"]
    model_keywords: ["Overseas"]
    exclude_keywords: ["222", "Patrimony", "Traditionnelle", "Fiftysix", "Malte",
                       "Chronograph", "Cronografo", "Dual Time", "Tourbillon",
                       # materiali che non ti interessano
                       "Oro", "Gold", "Rose", "Rosegold", "Rosé", "Platino",
                       "Platinum", "18K", "18 K", "Titanio", "Titanium"]
    hard_filters:
      min_year: 2023
      max_year: 2027
      absolute_min_price_eur: 18000
      absolute_max_price_eur: 68000
    preferences:
      target_years: [2024, 2025, 2026]
      acceptable_years: [2023]
    fair_value:
      # mediana UE 34.000 su 7 annunci in acciaio (rilevazione 11/09/2026)
      seed_price_eur: 34000
      # listino Vacheron: CHF 25.400 al cambio 1,0635 del 05/09/2026
      list_price_eur: 27000
    notifications:
      always_notify_if_underpriced_pct: 15.0

  - id: vc-overseas-4500
    brand: Vacheron Constantin
    model: Overseas 41 (4500V)
    nickname: Overseas precedente
    references: ["4500V/110A-B128"]
    reference_stems: ["4500V"]
    exclude_references: ["4500V/000R", "4500V/000G", "4500V/000P"]
    search_terms: ["4500V", "Overseas"]
    model_keywords: ["Overseas"]
    exclude_keywords: ["222", "Patrimony", "Traditionnelle", "Fiftysix", "Malte",
                       "Chronograph", "Cronografo", "Dual Time", "Tourbillon",
                       "Oro", "Gold", "Rose", "Rosegold", "Rosé", "Platino",
                       "Platinum", "18K", "18 K", "Titanio", "Titanium"]
    hard_filters:
      # 2016 e' l'anno di lancio, 2025 l'ultimo plausibile: dopo c'e' il 4520V.
      min_year: 2016
      max_year: 2025
      absolute_min_price_eur: 14000
      absolute_max_price_eur: 56000
    preferences:
      target_years: [2022, 2023, 2024]
      acceptable_years: [2019, 2020, 2021]
      tolerated_years: [2016, 2017, 2018]
    fair_value:
      # mediana UE 27.700 su 26 annunci in acciaio (rilevazione 11/09/2026).
      # Campione largo e prezzi sparsi fra 20.350 e 35.050: sul fuori
      # produzione contano molto anno, corredo e stato, e il modello lo sa.
      seed_price_eur: 27700
      # Fuori produzione: nessun listino con cui confrontarsi.
      #
      # E una tabella degli anni tutta sua, che e' la cosa piu' importante di
      # questo blocco.
      #
      # Quella generale e' centrata sul 2024 (=1,00) perche' descrive un
      # orologio ancora in produzione, dove un esemplare dell'anno scorso e'
      # davvero quello tipico. Il 4500V e' uscito di produzione: di esemplari
      # 2024 non ce ne sono quasi, il tipico e' un 2021. Con la tabella
      # generale ogni 4500V prendeva `_default` 0,89 e risultava caro rispetto
      # a un indice che invece misura proprio quegli esemplari li'. Risultato:
      # il Vacheron di Zorzoli veniva dato al 17% SOPRA il valore equo, e in
      # pratica non sarebbe mai arrivata una notifica su questo modello.
      #
      # Qui il centro e' il 2021, e lo scarto fra il primo e l'ultimo anno di
      # produzione resta stretto: su un fuori produzione l'anno pesa molto
      # meno di corredo e stato.
      #
      # Gli anni vanno scritti senza virgolette, come nella tabella generale:
      # la fusione e' per chiave, e `"2024"` e `2024` sono chiavi diverse —
      # resterebbero tutte e due, e quale vince dipenderebbe dall'ordine.
      multipliers:
        year:
          2026: 1.06
          2025: 1.06
          2024: 1.06
          2023: 1.04
          2022: 1.02
          2021: 1.00
          2020: 0.99
          2019: 0.97
          2018: 0.96
          2017: 0.95
          2016: 0.94
          _default: 0.97
    notifications:
      always_notify_if_underpriced_pct: 15.0

  # I due Royal Oak in produzione, tenuti separati: il Jumbo vale il doppio
  # abbondante del 41mm, e un solo indice per entrambi non direbbe niente su
  # nessuno dei due. E' la lezione del Tudor Flamingo/Panda.
  #
