  - id: vc-222
    # photo: "https://..."
    group: a
    brand: Vacheron Constantin
    model: Historiques 222
    references: ["4200H/222A-B934"]
    search_terms: ["4200H", "Historiques 222"]
    model_keywords: ["222", "Historiques"]
    exclude_keywords: ["Overseas", "Patrimony", "Traditionnelle", "Fiftysix"]
    hard_filters:
      min_year: 2022
      max_year: 2027
      absolute_min_price_eur: 40000
      absolute_max_price_eur: 200000
    preferences:
      target_years: [2025, 2026]
      acceptable_years: [2023, 2024]
      tolerated_years: [2022]
    fair_value:
      seed_price_eur: 105000    # nessun dato: alzato del 10%
    notifications:
      always_notify_if_underpriced_pct: 15.0

  - id: vc-overseas
    # photo: "https://..."
    group: a
    brand: Vacheron Constantin
    model: Overseas
    references: ["4520V/210A-B128"]
    search_terms: ["4520V", "Overseas"]
    model_keywords: ["Overseas"]
    exclude_keywords: ["222", "Patrimony", "Traditionnelle", "Fiftysix", "Malte"]
    hard_filters:
      min_year: 2016
      max_year: 2027
      absolute_min_price_eur: 12000
      absolute_max_price_eur: 70000
    preferences:
      target_years: [2024, 2025, 2026]
      acceptable_years: [2021, 2022, 2023]
      tolerated_years: [2018, 2019, 2020]
    fair_value:
      seed_price_eur: 35000    # nessun dato: alzato del 17%
    notifications:
      always_notify_if_underpriced_pct: 15.0

  - id: royal-oak-15450
    # photo: "https://..."
    group: a
    brand: Audemars Piguet
    model: Royal Oak 37
    references: ["15450ST.OO.1256ST.03"]
    search_terms: ["15450ST", "Royal Oak 15450"]
    model_keywords: ["Royal Oak"]
    exclude_keywords: ["Offshore", "Concept", "Code 11.59", "Millenary"]
    # Prodotto fino al 2021 circa: la finestra anni parte da molto prima.
    hard_filters:
      min_year: 2012
      max_year: 2027
      absolute_min_price_eur: 15000
      absolute_max_price_eur: 80000
    preferences:
      target_years: [2019, 2020, 2021]
      acceptable_years: [2016, 2017, 2018]
      tolerated_years: [2013, 2014, 2015]
    fair_value:
      seed_price_eur: 37000    # nessun dato: alzato del 16%
    notifications:
      always_notify_if_underpriced_pct: 15.0

  - id: el-primero-a384
    # photo: "https://..."
    group: b
    brand: Zenith
    model: Chronomaster Revival A384
    references: ["03.A384.400/3817.M3817"]
    search_terms: ["A384", "El Primero A384"]
    model_keywords: ["A384", "El Primero", "Chronomaster"]
    exclude_keywords: ["Defy", "Pilot", "Elite", "Sport"]
    hard_filters:
      min_year: 2019
      max_year: 2027
      absolute_min_price_eur: 3000
      absolute_max_price_eur: 18000
    preferences:
      target_years: [2024, 2025, 2026]
      acceptable_years: [2022, 2023]
      tolerated_years: [2019, 2020, 2021]
    fair_value:
      seed_price_eur: 8000    # nessun dato: alzato per coerenza con gli altri
    notifications:
      always_notify_if_underpriced_pct: 15.0


# -----------------------------------------------------------------------------
# FILTRI DURI — usali il meno possibile.
# Filosofia: il sistema non deve *escludere*, deve *pesare*. Un 2023 impeccabile
# a 26.000 € deve arrivarti comunque, con un punteggio alto.
# -----------------------------------------------------------------------------
hard_filters:
  # Range di anni ampio: fuori range NON viene scartato, viene solo penalizzato.
  # Serve solo a evitare di raccogliere referenze pre-ceramica per errore.
  min_year: 2018
  max_year: 2027
  # Prezzo oltre il quale l'annuncio è quasi certamente un errore o un "price on
  # request" mal parsato. Non è il tuo budget.
  absolute_max_price_eur: 90000
  absolute_min_price_eur: 12000
  # Scarta gli annunci marcati come venduti / non disponibili.
  exclude_sold: true

# -----------------------------------------------------------------------------
# PREFERENZE — entrano nello scoring, non nell'esclusione.
# -----------------------------------------------------------------------------
preferences:
  target_years: [2025, 2026]      # ideale
  acceptable_years: [2024]        # buono
  tolerated_years: [2023]         # accettabile se il prezzo compensa

  bracelet:
    preferred: jubilee
    other_penalty: -12            # oyster: penalizzato, non escluso

  condition_rank:                 # dal migliore al peggiore
    - unworn
    - new
    - mint
    - like_new
    - excellent
    - very_good
    - good

  # Dove è stata emessa la garanzia. Conta per la rivendibilità in Italia.
  warranty_regions:
    preferred: [IT, SM, EU]
    neutral: [CH, UK, JP, US]
    disliked: [AE, SA, QA, KW, BH, OM, TR, HK]   # penalizzati, NON esclusi

  # DOVE SI TROVA L'OROLOGIO — tre piani, non un punteggio.
  #
  # Non è una preferenza da pesare: è un cancello sulle notifiche. Tu compri
  # andando a vedere l'orologio, quindi un Royal Oak a Singapore non è "meno
  # interessante", è irrilevante — ma il suo prezzo serve per capire il
  # mercato, quindi resta nel database e nell'indice.
  #
  #   home       Italia e San Marino: primo piano, notifiche normali
  #   nearby     Europa: secondo piano, notifica solo se ne vale davvero la pena
  #   (resto)    solo riferimento di prezzo, mai notificato
  #
  # Nota: la garanzia è un'altra cosa ancora. Un orologio a Bologna con
  # garanzia emiratina sta in Italia ma è scomodo da rivendere. Restano due
  # dimensioni separate.
  geography:
    home: [IT, SM]
    nearby: [EU, CH]

  full_set: strongly_preferred    # box + garanzia + cartellino
  never_polished: preferred
  dealer_only: false              # i privati possono essere ottime occasioni

# -----------------------------------------------------------------------------
# BUDGET — usato per il contesto, non come filtro
# -----------------------------------------------------------------------------
budget:
  comfortable_eur: 28000          # sotto questo sei sereno
  stretch_eur: 34000              # sopra questo devi volerlo davvero
  # NB: il 126710BLRO è stato discontinuato ad aprile 2026. Il mercato si è
  # riprezzato verso l'alto. Rivedi questi numeri ogni 2-3 mesi guardando la
  # mediana che il sistema stesso calcola (la trovi in dashboard).

# -----------------------------------------------------------------------------
# FAIR VALUE — motore di stima
# -----------------------------------------------------------------------------
fair_value:
  # Prezzo di partenza usato SOLO finché non ci sono abbastanza annunci nel DB.
  # Riferimento: unworn 2025, jubilee, full set, garanzia EU.
  seed_price_eur: 31000
  # Numero minimo di annunci comparabili per passare alla stima data-driven.
  min_samples: 10
  # Finestra temporale (giorni) degli annunci usati per la mediana.
  lookback_days: 60
  # Moltiplicatori edonici: servono a normalizzare annunci diversi tra loro
  # prima di calcolare la mediana, e poi a ri-adattarla al singolo annuncio.
  multipliers:
    year:
      2026: 1.06
      2025: 1.00
      2024: 0.95
      2023: 0.91
      2022: 0.88
      _default: 0.85
    condition:
      unworn: 1.00
      new: 1.00
      mint: 0.96
      like_new: 0.94
      excellent: 0.90
      very_good: 0.85
      good: 0.79
      _default: 0.90
    bracelet:
      jubilee: 1.00
      oyster: 0.97
      _default: 0.99
    full_set:
      true: 1.00
      false: 0.93
    warranty_region:
      IT: 1.02
      EU: 1.01
      CH: 1.00
      UK: 1.00
      JP: 0.99
      US: 0.98
      AE: 0.94
      SA: 0.94
      QA: 0.94
      _default: 0.98
    never_polished:
      true: 1.01
      false: 1.00
  # Soglia per marcare un annuncio come "sotto mercato"
  underpriced_threshold_pct: 4.0

# -----------------------------------------------------------------------------
# SCORING — 0..100
# I pesi sono il massimo punto ottenibile per ciascuna voce.
# -----------------------------------------------------------------------------
scoring:
  # La geografia NON è qui dentro di proposito: è un cancello sulle notifiche,
  # non un ingrediente del punteggio. Così i punteggi restano confrontabili fra
  # paesi, e l'indice di mercato non si deforma.
  weights:
    price_vs_fair: 40      # quanto costa rispetto a quanto vale
    year: 12
    condition: 12
    full_set: 10
    warranty: 8
    bracelet: 6            # fuori dal mondo Rolex conta poco
    seller_trust: 6
    never_polished: 6
  # Un annuncio a fair value esatto prende metà del peso price_vs_fair.
  # Sconto pari a questo valore (%) → punteggio pieno.
  price_full_credit_discount_pct: 10.0
  # Sovrapprezzo pari a questo valore (%) → zero punti sulla voce prezzo.
  price_zero_credit_premium_pct: 12.0

# -----------------------------------------------------------------------------
# NOTIFICHE
# -----------------------------------------------------------------------------
notifications:
  # --- Italia e San Marino: primo piano ---
  min_score: 78                    # soglia per la notifica "annuncio buono"
  # Un annuncio sotto mercato ti arriva SEMPRE, anche con score più basso.
  always_notify_if_underpriced_pct: 6.0

  # --- Europa: secondo piano ---
  # Soglie più alte: raggiungibile, ma deve valerne il viaggio.
  # 88 e non 95: deve restare raggiungibile da un annuncio davvero buono,
  # altrimenti l'Europa diventa muta come il resto del mondo e il "secondo
  # piano" non esiste piu'.
  nearby_min_score: 88
  nearby_underpriced_pct: 15.0

  # --- Resto del mondo ---
  # Raccolto e usato per l'indice di mercato, mai notificato. Mettilo a true
  # se vuoi vedere anche quelli (utile per qualche giorno, poi stanca).
  notify_reference: false

  # Molti annunci non dichiarano dove si trovano. Trattarli come "resto del
  # mondo" significherebbe perdere occasioni italiane mal compilate, quindi
  # finiscono in Europa: notificati, ma con la soglia alta.
  unknown_location_as: nearby
  # Re-notifica su annuncio già visto solo se:
  price_drop_pct: 2.0              # il prezzo scende almeno di questo
  price_drop_abs_eur: 400          #   ...o di questa cifra assoluta
  score_improvement: 6             # o lo score migliora di questo
  # Silenzio notturno (ora locale Europe/Rome)
  quiet_hours: [23, 7]
  max_per_run: 12                  # anti-spam in caso di primo popolamento

# -----------------------------------------------------------------------------
# FONTI
# -----------------------------------------------------------------------------
# type: html   -> scraping diretto con selettori CSS (per siti "aperti")
# type: email  -> ingestione degli alert email che i marketplace ti mandano
#                 (l'unica via affidabile per Chrono24 & co., vedi README)
#
# Usa `python -m radar.main probe` dopo ogni modifica.
# -----------------------------------------------------------------------------
sources:

  # --- Ingestione alert email: la fonte più robusta del sistema --------------
  - name: email_alerts
    type: email
    enabled: true
    imap_host_env: IMAP_HOST
    imap_user_env: IMAP_USER
    imap_pass_env: IMAP_PASS
    mailbox: Radar
    # Ogni mittente aggiunto qui va aggiunto ANCHE al filtro Gmail, altrimenti
    # le mail finiscono in posta in arrivo e il sistema non le vede mai.
    from_contains:
      - chrono24
      - subito           # privati italiani: l'unico canale che li copre
      - ebay
      - catawiki         # aste, molti venditori italiani
      - watchfinder
      - wristler
      - chronohunter
      - watchmaster
      - subito
      - conteorologi
      - edwatch
      - pluswatch
      - eorologi
      - bonanno
      - dellarocca
      - pedretti
      - paselli
    unseen_only: true
    mark_seen: true

  # --- VERIFICATA: funziona ------------------------------------------------
  - name: pluswatch
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    start_urls:
      - "https://www.pluswatch.it/?s={q}&post_type=product"
    item_selector: "li.product, div.product, article.product"
    fields:
      title: "h2, h3, .woocommerce-loop-product__title"
      price: ".price, .woocommerce-Price-amount"
      url: "a@href"
      image: "img@src"

  # --- della Rocca: dominio corretto, pagina modello -------------------------
  # La loro ricerca interna ignora la referenza e restituisce tutto il catalogo
  # Rolex, con "126710BLRO" appiccicato alle descrizioni per SEO. Inutilizzabile.
  # Usiamo invece le pagine di modello, che contengono prodotti veri.
  - name: dellarocca
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    start_urls:
      - "https://www.dellaroccagioielli.it/o_32-Rolex+Professionali.php"
    item_selector: "div.prodotto, div.box_prodotto, td.prodotto"
    fields:
      title: "h3, h2, a"
      price: ".prezzo, .price"
      url: "a@href"
      image: "img@src"

  # --- Davide Pedretti: dominio corretto ------------------------------------
  - name: davidepedretti
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 5
    start_urls:
      - "https://shop.davidepedretti.com/?s={q}&post_type=product"
    item_selector: "li.product, article.product, .product-item, .type-product"
    fields:
      title: "h2, h3, .woocommerce-loop-product__title, .product-item__title"
      price: ".price, .amount"
      url: "a@href"
      image: "img@src"

  # --- VERIFICATO A MANO: ha 3 Pepsi 126710BLRO a catalogo -------------------
  - name: conteorologi
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    start_urls:
      - "https://www.conteorologi.it/?s={q}&post_type=product"
    item_selector: "li.product, .product, article.product, .type-product"
    fields:
      title: "h2, h3, .woocommerce-loop-product__title"
      price: ".price, .amount, .woocommerce-Price-amount"
      url: "a@href"
      image: "img@src"

  # --- VERIFICATO A MANO: ha un "GMT MASTER II BLRO REF. 126710" -------------
  # Sito su misura, non WooCommerce. Scrive la referenza invertita: il matching
  # ora la riconosce. I selettori sono un'ipotesi: verifica con `inspect`.
  - name: lorologiaiodicorte
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 3
    start_urls:
      - "https://www.lorologiaiodicorte.it/?catId=2"
    item_selector: ".product, .card, .item, .col-md-4, .col-lg-4"
    fields:
      title: "h6, h5, h2, a"
      price: ".price, .prezzo"
      url: "a@href"
      image: "img@src"

  # --- Da verificare col probe ----------------------------------------------
  - name: bonanno
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    start_urls:
      - "https://www.gioielleriabonanno.it/?s={q}&post_type=product"
      - "https://www.bonannovintage.it/?s={q}"
    item_selector: "li.product, .product, article"
    fields:
      title: "h2, h3, .woocommerce-loop-product__title, .entry-title"
      price: ".price, .amount"
      url: "a@href"
      image: "img@src"

  - name: edwatch
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 4
    # VERIFICATO: la ricerca funziona. Oggi hanno solo Batman e Sprite, quindi
    # 0 pertinenti è il risultato corretto, non un selettore rotto.
    start_urls:
      # La pagina /negozio/ portava 31 annunci grezzi, 0 pertinenti e 90
      # secondi di giro: la ricerca copre gia' tutto il catalogo.
      - "https://edwatch.it/?s={q}&post_type=product"
    item_selector: "li.product, .product, article"
    fields:
      title: "h2, h3, .woocommerce-loop-product__title"
      price: ".price, .amount"
      url: "a@href"
      image: "img@src"

  # Spenta: /?s=126710 non estrae nulla, /orologi/ e /shop/ danno 404.
  # Il loro sito non espone un catalogo leggibile. Da coprire con newsletter.
  - name: tempoprezioso
    type: html
    enabled: false
    country: IT
    dealer: true
    seller_trust: 3
    start_urls:
      - "https://www.tempopreziosobologna.com/?s={q}"
      - "https://www.tempopreziosobologna.com/orologi/"
      - "https://www.tempopreziosobologna.com/shop/"
    item_selector: "li.product, .product, article"
    fields:
      title: "h2, h3, .woocommerce-loop-product__title"
      price: ".price, .amount"
      url: "a@href"
      image: "img@src"

  # --- Candidati italiani da verificare col probe ---------------------------
  # VERIFICATO: a catalogo c'è un 126710BLRO. Griglia costruita con Elementor,
  # quindi niente <li class="product">: i selettori sono volutamente larghi.
  - name: eorologi
    type: html
    enabled: true
    country: IT
    dealer: true
    seller_trust: 3
    start_urls:
      - "https://eorologi.com/?s={q}&post_type=product"
    item_selector: >
      li.product, .product, .type-product, article.product,
      .elementor-widget-woocommerce-products li, .products > li
    fields:
      title: >
        h2, h3, .woocommerce-loop-product__title,
        .elementor-heading-title, a@title
      price: ".price, .amount, .woocommerce-Price-amount"
      url: "a@href"
      image: "img@src"

  - name: loradelgallo
    type: html
    enabled: false   # 0 elementi estratti: sito non WooCommerce
    country: IT
