      max_year: 2027
      absolute_min_price_eur: 2500
      absolute_max_price_eur: 16000
    preferences:
      target_years: [2025, 2026]
      acceptable_years: [2024]
      tolerated_years: []
    fair_value:
      seed_price_eur: 8500    # osservato 8.800 da Pedretti, full set italiano
    notifications:
      always_notify_if_underpriced_pct: 15.0

  - id: zenith-ultrathin
    # photo: "https://..."
    group: a
    brand: Zenith
    model: Elite Ultra Thin
    references: ["18.2010.681/01.C498"]
    search_terms: ["18.2010.681", "Zenith Elite"]
    model_keywords: ["Elite", "Ultra Thin", "Ultrathin"]
    exclude_keywords: ["Defy", "Pilot", "Chronomaster Sport"]
    hard_filters:
      min_year: 2015
      max_year: 2027
      absolute_min_price_eur: 4000
      absolute_max_price_eur: 25000
    preferences:
      target_years: [2024, 2025, 2026]
